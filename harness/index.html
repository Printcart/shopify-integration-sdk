<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Upload intake QA harness</title>
    <!-- The real SDK also injects a <link> to the unpkg-hosted stylesheet at
         runtime (#addStyle in main.ts); that network call is unreachable/stale
         in this offline harness, so we preload the locally-built stylesheet
         here to see the real styling instead. -->
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { font-family: sans-serif; max-width: 640px; margin: 24px auto; }
      #controls { position: fixed; top: 0; right: 0; background: #222; color: #fff; padding: 12px; font-size: 12px; z-index: 99999999999; }
      #controls button { display: block; margin: 4px 0; width: 100%; }
      #log { white-space: pre-wrap; font-family: monospace; font-size: 11px; background: #f5f5f5; padding: 8px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <div id="controls">
      <div>Scenario:
        <select id="scenario">
          <option value="success">success</option>
          <option value="validation">422 validation</option>
          <option value="serverError">5xx (fallback)</option>
          <option value="network">network error (fallback)</option>
        </select>
      </div>
      <button id="btn-open">Open uploader</button>
      <button id="btn-emit">Emit upload-success</button>
      <div>POST calls: <span id="call-count">0</span></div>
    </div>

    <div id="app">
      <form action="/cart/add">
        <input type="hidden" name="id" value="47605765112098" />
        <input type="number" name="quantity" value="2" />
        <button type="submit">Add to cart</button>
      </form>
    </div>

    <div id="log"></div>

    <script>
      window.__PC_TEST__ = { scenario: "success", calls: 0 };

      function log(msg) {
        const el = document.getElementById("log");
        el.textContent += msg + "\n";
      }

      document.getElementById("scenario").addEventListener("change", (e) => {
        window.__PC_TEST__.scenario = e.target.value;
      });

      const jsonResponse = (status, body) =>
        new Response(JSON.stringify(body), {
          status,
          headers: { "Content-Type": "application/json" },
        });

      const realFetch = window.fetch.bind(window);

      window.fetch = async (url, options) => {
        const href = typeof url === "string" ? url : url.toString();

        if (href.includes("/integration/shopify/products/")) {
          log("GET product config");
          return jsonResponse(200, {
            data: {
              id: "11111111-1111-1111-1111-111111111111",
              enable_design: false,
              enable_upload: true,
              enable_request_quote: false,
            },
          });
        }

        if (href.includes("/stores/store-details")) {
          log("GET store-details");
          return jsonResponse(200, {
            data: {
              language: "en",
              setting_defaults: { customCss: { value: "" }, textReplace: {} },
            },
          });
        }

        if (href.includes("/upload-intakes/form-config")) {
          log("GET upload-intakes/form-config");
          return jsonResponse(200, {
            data: {
              phone: "optional",
              note: true,
              require_consent: false,
              consent_text: null,
              store_name: "Test Store",
            },
          });
        }

        if (href.includes("/upload-intakes") && options && options.method === "POST") {
          window.__PC_TEST__.calls++;
          document.getElementById("call-count").textContent = window.__PC_TEST__.calls;
          log("POST upload-intakes attempt #" + window.__PC_TEST__.calls + " body=" + options.body);

          const scenario = window.__PC_TEST__.scenario;

          if (scenario === "network") {
            throw new TypeError("Failed to fetch (simulated)");
          }

          if (scenario === "serverError") {
            return jsonResponse(500, { message: "Internal error (simulated)" });
          }

          if (scenario === "validation") {
            return jsonResponse(422, { message: "Email looks invalid." });
          }

          return jsonResponse(201, {
            data: {
              intake_uuid: "22222222-2222-2222-2222-222222222222",
              reference: "UP-8F3K2",
              project_id: "33333333-3333-3333-3333-333333333333",
              status: "awaiting_checkout",
              buyer: { name: "Ada Lovelace", email: "ada@example.com" },
            },
          });
        }

        log("passthrough fetch " + href);
        return realFetch(url, options);
      };
    </script>
    <script src="./main.js?shopT=test-unauth-token"></script>
    <script>
      document.getElementById("btn-open").addEventListener("click", () => {
        window.__pcFakeUploader && window.__pcFakeUploader.open();
      });
      document.getElementById("btn-emit").addEventListener("click", () => {
        window.__pcFakeUploader &&
          window.__pcFakeUploader.emit("upload-success", [
            {
              data: {
                id: "design-aaaa-0001",
                design_image: { url: "https://files.printcart.com/common/upload.svg" },
                preview_image: {},
                preview: {},
              },
            },
          ]);
      });
    </script>
  </body>
</html>
